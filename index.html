<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FBFBF9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Assimilate" />
    <meta name="description" content="An idle territory-conquest game: shape how your black territory spreads and fights rival factions across an endless grid." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Assimilate</title>
  </head>
  <body>
    <div id="app">
      <canvas id="field" aria-label="The battlefield: your black territory and coloured rival factions" role="img"></canvas>

      <header id="hud" aria-label="Status">
        <div class="stat" id="stat-energy">
          <span class="stat-label">Energy</span>
          <span class="stat-value" data-v>0</span>
          <span class="stat-rate" data-r>+0/s</span>
        </div>
        <div class="stat" id="stat-territory">
          <span class="stat-label">Arena</span>
          <span class="stat-value" data-v>0</span>
          <span class="stat-rate" data-r>+0/s</span>
        </div>
        <div class="stat" id="stat-status">
          <span class="stat-label">Status</span>
          <span class="stat-value" data-v>Expanding</span>
          <span class="stat-rate" data-r>Scale 1</span>
        </div>
        <div id="standings" aria-label="Arena standings"><div class="bars"></div><i class="goal"></i></div>
      </header>

      <pre id="diag" hidden aria-hidden="true"></pre>
      <div id="banner" aria-live="polite"></div>
      <div id="tip" hidden></div>
      <div id="toasts" aria-live="polite"></div>

      <section id="controls" aria-label="Simulation controls">
        <button id="pause-btn" class="ctl" type="button" aria-label="Pause"></button>
        <button id="recenter-btn" class="ctl" type="button" aria-label="Re-centre on your territory" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" class="fill"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg>
        </button>
        <div class="seg" id="speed" role="group" aria-label="Simulation speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="2" aria-pressed="false">2×</button>
          <button type="button" data-speed="4" aria-pressed="false">4×</button>
        </div>
      </section>

      <section id="sheet" aria-label="Panel" hidden>
        <div class="sheet-head">
          <h2 id="sheet-title">Territory</h2>
          <button class="close" id="sheet-close" type="button" aria-label="Close panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </section>

      <nav id="tabs" aria-label="Main">
        <button type="button" data-tab="territory">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" class="fill"/><rect x="13" y="4" width="7" height="7" rx="1.5" class="fill"/><rect x="4" y="13" width="7" height="7" rx="1.5" class="fill"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Territory</span><i class="dot" hidden></i>
        </button>
        <button type="button" data-tab="upgrades">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/><path d="M5 20h14"/></svg><span>Upgrades</span><i class="dot" hidden></i>
        </button>
        <button type="button" data-tab="league">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg><span>League</span>
        </button>
        <button type="button" data-tab="stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span>Stats</span>
        </button>
        <button type="button" data-tab="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span>
        </button>
      </nav>

      <div id="modal-root"></div>
      <noscript>Assimilate needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
