<title>Entity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
  /* Layout: the sky fills the screen; a whisper of type on top; a strip of purchases along the bottom. */
  :root {
    --sky: #FBFBF8;
    --sky-rgb: 251, 251, 248;
    --ink: #151515;
    --mute: #8E8C86;
    --line: #E6E4DE;
    --card: rgba(255, 255, 255, 0.86);
    --red: #DF4230;
    --yellow: #EFB32B;
    --blue: #2556C4;
    --display: "Jost", "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky); color: var(--ink); font-family: var(--display);
    overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  header {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    background: linear-gradient(var(--sky) 55%, rgba(var(--sky-rgb), 0));
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: 28px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }
  .label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); font-weight: 500; }
  #mass { font-size: 38px; font-weight: 300; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  #rate { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; margin-top: 2px; }
  #reset {
    pointer-events: auto; font: inherit; font-size: 12px; color: var(--mute); background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 32px;
  }
  #reset.armed { color: var(--red); border-color: var(--red); }
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; padding-top: 34px;
    background: linear-gradient(rgba(var(--sky-rgb), 0), var(--sky) 38%);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  #title {
    min-height: 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: 0 max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px));
  }
  #title h2 { margin: 0; font-size: 20px; font-weight: 400; letter-spacing: 0.01em; }
  #title p { margin: 2px 0 0; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .pill {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; min-height: 36px; white-space: nowrap;
  }
  #actions { display: flex; gap: 6px; }
  #shop {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  #shop::-webkit-scrollbar { display: none; }
  #shop.swap { opacity: 0; transform: translateY(10px); }
  .item {
    flex: 0 0 auto; width: 134px; text-align: left; font: inherit; color: var(--ink);
    background: var(--card); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 11px 11px 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer;
    transition: transform 0.12s ease, opacity 0.3s ease, border-color 0.3s ease;
  }
  .item:active { transform: scale(0.97); }
  .item:focus-visible, .pill:focus-visible, #reset:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .item svg { width: 26px; height: 26px; color: var(--ink); }
  .item .name { font-size: 15px; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .item .lv { font-size: 11px; color: var(--mute); white-space: nowrap; }
  .item .what { font-size: 12px; color: var(--mute); line-height: 1.3; min-height: 47px; }
  .item .cost { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .item.poor { opacity: 0.45; }
  .item.ready { border-color: var(--ink); }
  .item.done { opacity: 0.3; cursor: default; }
  .item.mystery { border-style: dashed; opacity: 0.55; cursor: default; }
  /* Opening: the title floats over a far-off view, then the camera glides in and the interface arrives. */
  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 10px; pointer-events: none; text-align: center; padding-top: 24vh;
    opacity: 0; transition: opacity 1.4s ease;
  }
  #intro.show { opacity: 1; }
  #intro h1 { margin: 0; font-size: 34px; font-weight: 300; letter-spacing: 0.5em; text-transform: uppercase; padding-left: 0.5em; }
  #intro p { margin: 0; font-size: 13px; color: var(--mute); letter-spacing: 0.08em; }
  header, #dock { transition: opacity 1.4s ease; }
  body.opening header, body.opening #dock, body.opening #home { opacity: 0; pointer-events: none; }
  #home {
    position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 64px);
    width: 40px; height: 40px; padding: 0; font-size: 18px; line-height: 1;
  }
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 96px); transform: translate(-50%, -6px);
    font-size: 14px; color: var(--ink); letter-spacing: 0.02em; opacity: 0; pointer-events: none;
    transition: opacity 0.9s ease, transform 0.9s ease; white-space: nowrap; max-width: calc(100vw - 36px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .item, #toast, #shop { transition: none; } }
</style>

<canvas id="sky" aria-label="A black entity at the centre, with dust, planets and moons slowly orbiting and falling into it"></canvas>
<header>
  <div>
    <div class="label">Mass</div>
    <div id="mass">0</div>
    <div id="rate">absorbing 0/s</div>
  </div>
  <button id="reset" type="button">Begin again</button>
</header>
<div id="dock">
  <div id="title"><div><h2 id="t-name"></h2><p id="t-info"></p></div><div id="actions"><button id="release" class="pill" type="button" hidden>Let it fall</button><button id="back" class="pill" type="button" hidden>Back</button></div></div>
  <nav id="shop" aria-label="Buy"></nav>
</div>
<button id="home" class="pill" type="button" hidden aria-label="Back to the normal view">◎</button>
<div id="intro" aria-hidden="true"><h1>Entity</h1><p>Everything falls inward, eventually</p></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ================================================================ constants
  const COL = { ink: '#151515', red: '#DF4230', yellow: '#EFB32B', blue: '#2556C4', sky: '#FBFBF8', mute: '#8E8C86' };
  // Day and night palettes. Everything is drawn through paint()/rgba(), which blend between them.
  const DAY = {
    [COL.sky]: [251, 251, 248], [COL.ink]: [21, 21, 21], [COL.mute]: [142, 140, 134],
    [COL.red]: [223, 66, 48], [COL.yellow]: [239, 179, 43], [COL.blue]: [37, 86, 196],
    body: [21, 21, 21], glow: [21, 21, 21], line: [230, 228, 222],
  };
  const NIGHT = {
    [COL.sky]: [11, 13, 20], [COL.ink]: [205, 211, 226], [COL.mute]: [108, 115, 132],
    [COL.red]: [255, 108, 86], [COL.yellow]: [255, 205, 96], [COL.blue]: [104, 156, 255],
    body: [4, 5, 8], glow: [190, 210, 255], line: [40, 45, 58],
  };
  const PAL = {}, PALS = {};
  let N = 0; // 0 = day, 1 = night
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const setPalette = (n) => {
    N = n;
    for (const k of Object.keys(DAY)) { PAL[k] = mix(DAY[k], NIGHT[k], n); PALS[k] = `rgb(${PAL[k].join(',')})`; }
    const root = document.documentElement.style;
    root.setProperty('--sky', PALS[COL.sky]);
    root.setProperty('--sky-rgb', PAL[COL.sky].join(','));
    root.setProperty('--ink', PALS[COL.ink]);
    root.setProperty('--mute', PALS[COL.mute]);
    root.setProperty('--line', PALS.line);
    root.setProperty('--card', `rgba(${mix([255, 255, 255], [24, 28, 38], n).join(',')},0.86)`);
    root.setProperty('color-scheme', n > 0.5 ? 'dark' : 'light');
    document.body.style.background = PALS[COL.sky];
  };
  const paint = (c) => PALS[c] || PALS[COL.ink];
  // How dark the sky should be at this local time: dusk from 18:30 to 20:30, dawn from 5:30 to 7:30.
  const nightness = (d = new Date()) => {
    const forced = location.hash.replace('#', '');
    if (forced === 'night') return 1;
    if (forced === 'day') return 0;
    const h = d.getHours() + d.getMinutes() / 60;
    const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
    return h >= 12 ? ss(18.5, 20.5, h) : 1 - ss(5.5, 7.5, h);
  };
  const DUST_COLORS = [COL.ink, COL.ink, COL.ink, COL.ink, COL.red, COL.yellow, COL.blue];
  const PLANET_COLORS = [COL.red, COL.blue, COL.yellow];
  const SLOTS = [110, 160, 215, 275, 340, 410];
  const NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI'];
  const KE = 150;          // the entity's pull: orbit speed = KE · r^-1.5 (radians per second)
  const SINK = [0.3, 0.6]; // how fast loose dust sinks toward the entity (world units per second)
  const KEY = 'entity.save.v2';
  const MAX_PARTS = 2400;
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fmt = (n) => {
    if (n < 10) return (Math.floor(n * 10) / 10).toString();
    if (n < 1000) return Math.floor(n).toString();
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx'];
    let i = -1;
    while (n >= 999.5 && i < u.length - 1) { n /= 1000; i++; }
    return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + u[i];
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const rgba = (c, a) => `rgba(${(PAL[c] || PAL[COL.ink]).join(',')},${a})`;

  // ================================================================ state
  const LV0 = { dust: 0, gravity: 0, disk: 0, halo: 0, comet: 0, belt: 0, nebula: 0, jets: 0 };
  const fresh = () => ({
    mass: 0, total: 0, entity: 0, lv: { ...LV0 }, planetsBought: 0, nextId: 1,
    planets: [], parts: [], comets: [], trickle: 0, beltTimer: 0, last: Date.now(),
  });
  let S = fresh();
  let loaded = false;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { S = Object.assign(fresh(), JSON.parse(raw)); S.lv = { ...LV0, ...S.lv }; loaded = true; }
  } catch (e) { /* storage unavailable: play without saving */ }
  const save = () => {
    try {
      S.last = Date.now();
      const r2 = (x) => Math.round(x * 100) / 100;
      const out = {
        ...S,
        planets: S.planets.map(({ vis, ...p }) => p),
        parts: S.parts.map((q) => ({ p: q.p, r: r2(q.r), rt: r2(q.rt), th: r2(q.th), vd: Math.round(q.vd * 1e4) / 1e4, s: r2(q.s), c: q.c, v: r2(q.v), k: q.k, tau: 0 })),
      };
      localStorage.setItem(KEY, JSON.stringify(out));
    } catch (e) {}
  };

  // ================================================================ rules
  const L = () => S.lv;
  const gravMult = () => 1 + 0.15 * L().gravity;
  const entityRadius = () => 13 + 8 * Math.log10(1 + S.entity / 80);
  const planetRadius = (pl) => (4.5 + 2.4 * Math.cbrt(pl.mass / 40)) * (1 + 0.1 * pl.lv.core);
  const planetPull = (pl) => 24 * Math.pow(planetRadius(pl) / 6, 1.5);
  const planetById = (id) => S.planets.find((p) => p.id === id);
  const planetPos = (pl) => ({ x: Math.cos(pl.th) * pl.r, y: Math.sin(pl.th) * pl.r });
  const freeSlot = () => {
    for (let i = 0; i < SLOTS.length; i++) if (!S.planets.some((p) => p.slot === i)) return i;
    return -1;
  };
  const dustValue = () => 1 + 0.1 * L().dust;
  const diskMult = () => 1 + 0.25 * L().disk;
  const beltRadius = () => SLOTS[SLOTS.length - 1] + 90;
  const nebulaRadius = () => beltRadius() + 210;
  const trickleEvery = () => 3 / gravMult() / (1 + 0.8 * L().nebula);
  const orbitSpeed = (q, parentR) => {
    if (q.p === 0) return KE * Math.pow(Math.max(q.r, parentR), -1.5);
    return planetPull(planetById(q.p)) * Math.pow(Math.max(q.r, parentR), -1.5);
  };
  // The view always holds the furthest thing that exists, so the system's size is felt as it grows.
  const viewRadius = () => {
    let r = 165;
    for (const p of S.planets) r = Math.max(r, p.rt + 45);
    for (const c of S.comets) r = Math.max(r, c.a * (1 + c.e) + 20);
    if (L().belt) r = Math.max(r, beltRadius() + 40);
    // The nebula is a backdrop: it fills the edges of the view rather than fitting inside it.
    return r;
  };

  // ================================================================ spawning
  // Loose dust drifts in from every direction, each mote on its own heading.
  const addEntityDust = (n, opts = {}) => {
    const R = entityRadius();
    for (let i = 0; i < n && S.parts.length < MAX_PARTS; i++) {
      // The very first motes start just above the entity's surface, so the first minute moves quickly.
      const rt = opts.close && i < 8 ? R * rand(1.04, 1.12) : rand(R * (opts.close ? 1.3 : 2.2), Math.min(170, viewRadius() * 0.7));
      const th = opts.at !== undefined ? opts.at.th + rand(-0.15, 0.15) : rand(0, Math.PI * 2);
      const r0 = opts.instant ? rt : opts.at ? opts.at.r : (L().nebula ? nebulaRadius() : viewRadius()) * rand(1.05, 1.5);
      S.parts.push({
        p: 0, r: r0, rt, th, vd: rand(SINK[0], SINK[1]), s: opts.s || rand(0.7, 1.6), c: opts.c || pick(DUST_COLORS),
        v: opts.v || dustValue(), tau: opts.instant ? 0 : opts.tau || rand(5, 9), k: opts.k || 'd',
      });
    }
  };
  const addPlanetMatter = (pl, n, kind) => {
    const pr = planetRadius(pl);
    for (let i = 0; i < n && S.parts.length < MAX_PARTS; i++) {
      const moon = kind === 'moon';
      const rt = moon ? pr * rand(4.4, 5.6) : rand(pr * 1.8, pr * 4.2);
      const life = moon ? rand(240, 330) : rand(70, 150);
      S.parts.push({
        p: pl.id, r: rt * rand(2.2, 3.4), rt, th: rand(0, Math.PI * 2), vd: (rt - pr) / life,
        s: moon ? rand(2.2, 2.8) : rand(0.6, 1.2), c: moon ? COL.ink : pick(DUST_COLORS),
        v: moon ? 40 * (1 + 0.5 * pl.lv.moon) : 3, tau: rand(1.6, 2.6), k: moon ? 'm' : 'd',
      });
    }
  };
  const newComet = () => {
    const j = S.comets.length;
    S.comets.push({ a: 150 + 40 * j, e: 0.82 - 0.03 * j, tilt: rand(0, Math.PI * 2), th: Math.PI * 0.95, shed: 10 + 3 * j });
  };

  // ================================================================ upgrades
  // Every upgrade has its own look, and buying one plays a short camera moment.
  const ICON = {
    dust: '<circle cx="5" cy="9" r="1.5" fill="currentColor"/><circle cx="14" cy="4" r="1.2" fill="#DF4230"/><circle cx="21" cy="11" r="1.7" fill="currentColor"/><circle cx="9" cy="18" r="1.3" fill="#2556C4"/><circle cx="18" cy="21" r="1.2" fill="#EFB32B"/><circle cx="13" cy="13" r="1" fill="currentColor"/>',
    planet: '<circle cx="13" cy="13" r="8" fill="#2556C4"/>',
    gravity: '<circle cx="13" cy="13" r="5" fill="currentColor"/><circle cx="13" cy="13" r="10.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3"/>',
    disk: '<ellipse cx="13" cy="13" rx="12" ry="4.5" fill="none" stroke="currentColor" stroke-width="0.8" opacity=".5"/><ellipse cx="13" cy="13" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="0.8" opacity=".7"/><circle cx="13" cy="13" r="4" fill="currentColor"/>',
    halo: '<circle cx="13" cy="13" r="5" fill="currentColor"/><circle cx="13" cy="13" r="8.5" fill="none" stroke="#EFB32B" stroke-width="1.5"/>',
    comet: '<circle cx="20" cy="6" r="3.2" fill="currentColor"/><circle cx="14" cy="12" r="2" fill="currentColor" opacity=".45"/><circle cx="9" cy="17" r="1.4" fill="currentColor" opacity=".25"/><circle cx="5" cy="21" r="1" fill="currentColor" opacity=".15"/>',
    belt: '<rect x="2" y="12" width="3.5" height="3.5" fill="#8E8C86" transform="rotate(20 4 14)"/><rect x="9" y="7" width="3" height="3" fill="currentColor"/><rect x="16" y="11" width="4" height="4" fill="#8E8C86" transform="rotate(-15 18 13)"/><rect x="21" y="5" width="2.5" height="2.5" fill="#DF4230"/><rect x="11" y="17" width="2.5" height="2.5" fill="#8E8C86"/>',
    nebula: '<circle cx="9" cy="11" r="7" fill="#DF4230" opacity=".18"/><circle cx="16" cy="14" r="8" fill="#2556C4" opacity=".16"/><circle cx="13" cy="9" r="5" fill="#EFB32B" opacity=".2"/>',
    jets: '<circle cx="13" cy="13" r="3.5" fill="currentColor"/><line x1="13" y1="1" x2="13" y2="9" stroke="currentColor" stroke-width="1.4"/><line x1="13" y1="17" x2="13" y2="25" stroke="currentColor" stroke-width="1.4"/>',
    ring: '<circle cx="13" cy="13" r="5" fill="#DF4230"/><circle cx="13" cy="13" r="10" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.2 2.6"/>',
    moon: '<circle cx="10" cy="15" r="6.5" fill="#2556C4"/><circle cx="21" cy="6" r="2.6" fill="currentColor"/>',
    atmo: '<circle cx="13" cy="13" r="11" fill="#2556C4" opacity=".14"/><circle cx="13" cy="13" r="7" fill="#2556C4"/>',
    rings: '<circle cx="13" cy="13" r="6" fill="#EFB32B"/><ellipse cx="13" cy="13" rx="12" ry="4" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 13 13)"/>',
    core: '<circle cx="13" cy="13" r="10" fill="#DF4230"/><circle cx="13" cy="13" r="4" fill="currentColor" opacity=".25"/>',
    trojan: '<path d="M2 20 A 14 14 0 0 1 24 20" fill="none" stroke="currentColor" stroke-width=".8" opacity=".4"/><circle cx="13" cy="7" r="3.5" fill="#2556C4"/><circle cx="4" cy="14" r="1.1" fill="currentColor"/><circle cx="6" cy="12" r="1" fill="currentColor"/><circle cx="22" cy="14" r="1.1" fill="currentColor"/><circle cx="20" cy="12" r="1" fill="currentColor"/>',
    anchor: '<circle cx="13" cy="13" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="13" cy="3" r="3" fill="#EFB32B"/>',
  };

  const SYSTEM = [
    {
      id: 'dust', name: 'Dust', unlock: 0, max: 999,
      what: () => `${18 + 3 * L().dust} motes drift in from every direction`,
      cost: () => 6 * Math.pow(1.24, L().dust),
      buy: () => { addEntityDust(18 + 3 * L().dust); L().dust++; cinematic('drift', 6); return 'Dust drifts in from the dark'; },
    },
    {
      id: 'gravity', name: 'Gravity', unlock: 25, max: 20,
      what: () => 'Everything falls 15% sooner; more stray dust',
      cost: () => 30 * Math.pow(2.1, L().gravity),
      buy: () => {
        L().gravity++;
        for (let i = 0; i < 3; i++) pulse(0, 0, entityRadius() * (3 + i * 1.6), COL.ink, 3 + i * 0.6, 0, i * 0.35);
        cinematic('entity', 4.5);
        return 'The entity pulls harder';
      },
    },
    {
      id: 'planet', name: 'Planet', unlock: 50, max: Infinity, lock: () => (freeSlot() < 0 ? 'Every orbit is taken' : ''),
      lvText: () => `${S.planets.length}/${SLOTS.length}`,
      what: () => 'A world that gathers matter and, one day, falls in',
      cost: () => 60 * Math.pow(2.8, S.planetsBought), can: () => freeSlot() >= 0,
      buy: () => {
        const slot = freeSlot(), rt = SLOTS[slot];
        const pl = {
          id: S.nextId++, slot, name: NUMERALS[S.planetsBought % NUMERALS.length], color: PLANET_COLORS[S.planetsBought % PLANET_COLORS.length],
          r: rt * 2.2, rt, th: rand(0, Math.PI * 2), vd: rt / (620 + 160 * slot), mass: 50 * Math.pow(1.6, S.planetsBought),
          tau: 6.5, anchored: false, lv: { ring: 0, moon: 0, atmo: 0, rings: 0, core: 0, trojan: 0, anchor: 0 },
        };
        S.planets.push(pl);
        S.planetsBought++;
        cinematic('arrive', 8, pl.id);
        return `Planet ${pl.name} enters orbit`;
      },
    },
    {
      id: 'disk', name: 'Accretion disk', unlock: 140, max: 10,
      what: () => 'A fine swirl hugs the entity; all it absorbs is worth +25%',
      cost: () => 140 * Math.pow(2.2, L().disk),
      buy: () => { L().disk++; cinematic('entity', 5.5); return L().disk === 1 ? 'A disk of fine matter forms' : 'The disk thickens'; },
    },
    {
      id: 'halo', name: 'Photon ring', unlock: 380, max: 10,
      what: () => `A shimmering ring; ${4 * (L().halo + 1)}% of arrivals flare for ×5`,
      cost: () => 380 * Math.pow(2.4, L().halo),
      buy: () => { L().halo++; cinematic('entity', 5); return 'Light bends around the entity'; },
    },
    {
      id: 'comet', name: 'Comet', unlock: 850, max: 4,
      what: () => 'A long loop that sheds dust each time it swings past',
      cost: () => 850 * Math.pow(3.2, L().comet),
      buy: () => { L().comet++; newComet(); cinematic('wide', 7); return 'A comet falls inward'; },
    },
    {
      id: 'belt', name: 'Asteroid belt', unlock: 2400, max: 8,
      what: () => 'A vast ring of rock far out; now and then one falls in',
      cost: () => 2400 * Math.pow(2.6, L().belt),
      buy: () => { L().belt++; cinematic('wide', 8); return L().belt === 1 ? 'A belt of rock gathers in the distance' : 'The belt grows'; },
    },
    {
      id: 'nebula', name: 'Nebula', unlock: 7000, max: 5,
      what: () => 'Clouds at the edge of everything; dust drifts in from them',
      cost: () => 7000 * Math.pow(3, L().nebula),
      buy: () => { L().nebula++; cinematic('wide', 9); return L().nebula === 1 ? 'A nebula glows at the edge of the system' : 'The nebula deepens'; },
    },
    {
      id: 'jets', name: 'Polar jets', unlock: 20000, max: 5,
      what: () => 'Beams fire when a planet falls; its mass +40%',
      cost: () => 20000 * Math.pow(3, L().jets),
      buy: () => { L().jets++; jetFx.push({ t: 0, life: 3.5, power: 0.6 }); cinematic('entity', 5); return 'The entity learns to shine'; },
    },
  ];
  const slotCost = (pl) => Math.pow(1.4, pl.slot);
  const PLANET = [
    {
      id: 'ring', name: 'Dust ring', unlock: 0, max: 999,
      what: (pl) => `${14 + 2 * pl.lv.ring} motes; it grows heavier as they fall`,
      cost: (pl) => 20 * Math.pow(1.4, pl.lv.ring) * slotCost(pl),
      buy: (pl) => { addPlanetMatter(pl, 14 + 2 * pl.lv.ring, 'dust'); pl.lv.ring++; return `Dust settles around Planet ${pl.name}`; },
    },
    {
      id: 'moon', name: 'Moon', unlock: 0, max: 4,
      what: () => 'Circles for minutes, then falls in for a lot of mass',
      cost: (pl) => 70 * Math.pow(2.2, pl.lv.moon) * slotCost(pl),
      buy: (pl) => { addPlanetMatter(pl, 1, 'moon'); pl.lv.moon++; return `Planet ${pl.name} captures a moon`; },
    },
    {
      id: 'atmo', name: 'Atmosphere', unlock: 120, max: 6,
      what: () => 'A soft glow; matter landing here is worth +50%',
      cost: (pl) => 120 * Math.pow(2.3, pl.lv.atmo) * slotCost(pl),
      buy: (pl) => { pl.lv.atmo++; return `An atmosphere gathers around Planet ${pl.name}`; },
    },
    {
      id: 'rings', name: 'Rings', unlock: 300, max: 5,
      what: () => 'A tilted band that catches passing dust from the entity',
      cost: (pl) => 300 * Math.pow(2.5, pl.lv.rings) * slotCost(pl),
      buy: (pl) => { pl.lv.rings++; return `Rings form around Planet ${pl.name}`; },
    },
    {
      id: 'core', name: 'Dense core', unlock: 600, max: 6,
      what: () => 'The planet swells: +40% mass and a stronger pull',
      cost: (pl) => 500 * Math.pow(2.4, pl.lv.core) * slotCost(pl),
      buy: (pl) => { pl.lv.core++; pl.mass *= 1.4; return `Planet ${pl.name} grows denser`; },
    },
    {
      id: 'trojan', name: 'Trojans', unlock: 1500, max: 5,
      what: () => 'Swarms ride its orbit, ahead and behind; they fall with it',
      cost: (pl) => 1200 * Math.pow(2.6, pl.lv.trojan) * slotCost(pl),
      buy: (pl) => { pl.lv.trojan++; return `Trojans gather in Planet ${pl.name}’s orbit`; },
    },
    {
      id: 'anchor', name: 'Anchor', unlock: 3000, max: 1,
      what: () => 'Holds the planet in orbit until you let it fall',
      cost: (pl) => 2500 * slotCost(pl),
      buy: (pl) => { pl.lv.anchor = 1; pl.anchored = true; return `Planet ${pl.name} holds its orbit`; },
    },
  ];
  const ALL = [...SYSTEM, ...PLANET];
  const levelOf = (it, pl) => (pl ? pl.lv[it.id] : it.id === 'planet' ? S.planets.length : L()[it.id]);

  // ================================================================ camera
  // Critically damped springs: every move eases in and out, and moving targets are followed smoothly.
  const cam = { x: 0, y: 0, vx: 0, vy: 0, lz: 0, vlz: 0 };
  // Your own zoom and pan, on top of wherever the camera wants to be. Shapes are just shapes, so
  // the range is extreme: from the system as a speck to a single mote filling the screen.
  const user = { lz: 0, x: 0, y: 0 };
  const USER_ZOOM = [Math.log(0.05), Math.log(40)];
  let focus = 0;   // planet id viewed up close (0 = the whole system)
  let scene = null; // a short camera moment after a purchase
  const cinematic = (kind, until, id) => { scene = { kind, until, id, t: 0 }; resetUserView(); };
  const resetUserView = () => { user.lz = 0; user.x = 0; user.y = 0; };
  let W = 0, H = 0, dpr = 1, t = 0;
  const viewCenter = () => ({ x: W / 2, y: H * 0.46 });
  const camTarget = () => {
    const minDim = Math.min(W, H);
    const overview = { x: 0, y: 0, z: (minDim / 2 - 14) / (viewRadius() * 0.95) };
    const near = (pl) => {
      const p = planetPos(pl);
      const w = KE * Math.pow(pl.r, -1.5), lead = 2 / 2.4;
      return { x: p.x - Math.sin(pl.th) * pl.r * w * lead, y: p.y + Math.cos(pl.th) * pl.r * w * lead, z: (minDim * 0.36) / (planetRadius(pl) * 5.5) };
    };
    if (focus) {
      const pl = planetById(focus);
      if (pl) return near(pl);
      focus = 0;
    }
    if (scene) {
      if (scene.kind === 'arrive') {
        const pl = planetById(scene.id);
        if (pl) { const n = near(pl); return { x: n.x * 0.75, y: n.y * 0.75, z: Math.sqrt(n.z * overview.z) * 0.85 }; }
      }
      if (scene.kind === 'drift') return { ...overview, z: overview.z * 0.86 };
      if (scene.kind === 'entity') return { x: 0, y: 0, z: (minDim * 0.42) / (entityRadius() * 3) };
      // Big reveals pull far out, so the whole system becomes a small thing in a vast space, then ease back.
      if (scene.kind === 'wide') return { ...overview, z: overview.z * (scene.t < scene.until * 0.55 ? 0.22 : 0.8) };
    }
    return overview;
  };
  const stepCamera = (dt) => {
    const base = camTarget();
    const tg = { x: base.x + user.x, y: base.y + user.y, z: base.z * Math.exp(user.lz) };
    const w = reduced ? 6 : focus ? 2.4 : scene && scene.kind === 'wide' ? 0.9 : scene && scene.kind !== 'drift' ? 1.3 : 1.0;
    const spring = (x, v, target) => { v += (w * w * (target - x) - 2 * w * v) * dt; return [x + v * dt, v]; };
    [cam.x, cam.vx] = spring(cam.x, cam.vx, tg.x);
    [cam.y, cam.vy] = spring(cam.y, cam.vy, tg.y);
    [cam.lz, cam.vlz] = spring(cam.lz, cam.vlz, Math.log(tg.z));
  };

  // ================================================================ simulation
  const ripples = [], jetFx = [], flares = [];
  const pulse = (x, y, r, color, life = 1.6, parent = 0, delay = 0) => ripples.push({ x, y, r, color, life, t: -delay, parent });
  const gains = [];
  let gainAcc = 0;
  const gain = (v) => { S.entity += v; S.mass += v; S.total += v; gainAcc += v; };

  const absorbInto = (q, parentR, quiet) => {
    if (q.p === 0) {
      let v = q.v * diskMult();
      const flare = L().halo && Math.random() < 0.04 * L().halo;
      if (flare) v *= 5;
      gain(v);
      if (!quiet) {
        pulse(Math.cos(q.th) * parentR, Math.sin(q.th) * parentR, q.s * (q.k === 'r' ? 4 : 2.2), q.c, q.k === 'r' ? 2 : 1.2);
        if (flare) flares.push({ th: q.th, t: 0, c: q.c === COL.ink ? COL.yellow : q.c });
      }
    } else {
      const pl = planetById(q.p);
      if (!pl) return;
      pl.mass += q.v * 1.5 * (1 + 0.5 * pl.lv.atmo);
      if (!quiet) pulse(Math.cos(q.th) * parentR, Math.sin(q.th) * parentR, q.s * 2, q.c, 1.1, pl.id);
    }
  };

  const beginMerge = (pl, quiet) => {
    pl.merging = 0;
    const pp = planetPos(pl), R = entityRadius();
    for (const q of S.parts) {
      if (q.p !== pl.id) continue;
      const x = pp.x + Math.cos(q.th) * q.r, y = pp.y + Math.sin(q.th) * q.r;
      const r = Math.max(R * 1.4, Math.hypot(x, y));
      q.p = 0; q.r = r; q.rt = r; q.th = Math.atan2(y, x); q.vd = rand(1.2, 2.4); q.tau = 0;
    }
    if (!quiet) toast(`Planet ${pl.name} is falling in`);
  };

  const step = (dt, quiet) => {
    t += dt;
    const g = gravMult();
    const R = entityRadius();

    // ---- planets: settle into orbit, then (unless anchored) spiral very slowly inward
    for (const pl of S.planets) {
      if (!pl.vis) pl.vis = { atmo: 0, rings: 0, trojan: 0, anchor: 0, rad: planetRadius(pl) };
      const v = pl.vis, k = 1 - Math.exp(-dt / 1.6);
      v.atmo += (pl.lv.atmo - v.atmo) * k; v.rings += (pl.lv.rings - v.rings) * k;
      v.trojan += (pl.lv.trojan - v.trojan) * k; v.anchor += ((pl.anchored ? 1 : 0) - v.anchor) * k;
      v.rad += (planetRadius(pl) - v.rad) * k;
      if (pl.merging !== undefined) continue;
      if (!pl.anchored) pl.rt = Math.max(R * 0.4, pl.rt - pl.vd * g * dt);
      const kk = pl.tau > 0 ? 1 - Math.exp(-dt / pl.tau) : 1;
      pl.r += (pl.rt - pl.r) * kk;
      if (pl.tau > 0 && Math.abs(pl.r - pl.rt) < 0.5) pl.tau = 0;
      pl.th += KE * Math.pow(pl.r, -1.5) * dt;
      if (pl.r <= R + planetRadius(pl) * 0.6) beginMerge(pl, quiet);
    }
    // ---- planets falling in: shrink and sink, then vanish in a slow wave
    for (let i = S.planets.length - 1; i >= 0; i--) {
      const pl = S.planets[i];
      if (pl.merging === undefined) continue;
      pl.merging += dt;
      pl.th += KE * Math.pow(Math.max(pl.r, R), -1.5) * dt;
      pl.r = R * (1 - 0.7 * ease(Math.min(1, pl.merging / 3)));
      if (pl.merging >= 3) {
        const base = 50 * Math.pow(1.6, S.planetsBought - 1);
        const total = (pl.mass + pl.lv.trojan * 8 * base * 0.12) * (1 + 0.4 * L().jets) * diskMult();
        gain(total);
        if (!quiet) {
          pulse(0, 0, R * 5.5, pl.color, 4.2);
          pulse(0, 0, R * 3.2, COL.ink, 3.2, 0, 0.3);
          if (L().jets) jetFx.push({ t: 0, life: 4.5, power: 1 });
          toast(`Planet ${pl.name} joins the entity · +${fmt(total)}`);
        }
        if (focus === pl.id) setFocus(0);
        S.planets.splice(i, 1);
      }
    }

    // ---- particles
    const parts = S.parts;
    const ringed = S.planets.filter((pl) => pl.lv.rings && pl.merging === undefined).map((pl) => ({ pl, p: planetPos(pl), cap: planetRadius(pl) * (3 + 1.4 * pl.lv.rings) }));
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      const pl = q.p ? planetById(q.p) : null;
      if (q.p && !pl) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const parentR = q.p ? planetRadius(pl) : R;
      q.rt -= q.vd * g * dt;
      if (q.tau > 0) {
        q.r += (q.rt - q.r) * (1 - Math.exp(-dt / q.tau));
        if (Math.abs(q.r - q.rt) < 0.3) q.tau = 0;
      } else q.r = q.rt;
      q.th += orbitSpeed(q, parentR) * dt;
      // Ringed planets catch loose dust that drifts close.
      if (q.p === 0 && q.tau === 0 && ringed.length && q.k === 'd') {
        const x = Math.cos(q.th) * q.r, y = Math.sin(q.th) * q.r;
        for (const rp of ringed) {
          const dx = x - rp.p.x, dy = y - rp.p.y, d = Math.hypot(dx, dy);
          if (d < rp.cap) {
            const prr = planetRadius(rp.pl);
            q.p = rp.pl.id; q.r = d; q.rt = Math.max(prr * 1.5, d); q.th = Math.atan2(dy, dx);
            q.vd = (q.rt - prr) / rand(40, 80); q.tau = 0;
            break;
          }
        }
      }
      if (q.r <= parentR) {
        absorbInto(q, parentR, quiet);
        parts[i] = parts[parts.length - 1];
        parts.pop();
      }
    }

    // ---- comets: fast near the entity, slow far out; they shed dust as they swing past
    for (const c of S.comets) {
      const r = (c.a * (1 - c.e * c.e)) / (1 + c.e * Math.cos(c.th));
      const period = 95 / Math.sqrt(g);
      const h = (Math.PI * 2 * c.a * c.a * Math.sqrt(1 - c.e * c.e)) / period;
      const before = c.th;
      c.th += (h / (r * r)) * dt;
      if (c.th >= Math.PI * 2) c.th -= Math.PI * 2;
      if (before > Math.PI && c.th < Math.PI) {
        const a = c.th + c.tilt;
        addEntityDust(c.shed + 4 * L().comet, { at: { th: a, r }, tau: 2.5, v: dustValue() * 2 });
        if (!quiet) pulse(Math.cos(a) * r, Math.sin(a) * r, 10, COL.ink, 1.8);
      }
    }

    // ---- the belt: now and then a rock is nudged loose and spirals in
    if (L().belt) {
      S.beltTimer += dt;
      const every = 22 / L().belt;
      while (S.beltTimer > every) {
        S.beltTimer -= every;
        const br = beltRadius();
        S.parts.push({
          p: 0, r: br, rt: br, th: rand(0, Math.PI * 2), vd: rand(1.4, 2.2), s: rand(2, 3), c: Math.random() < 0.15 ? COL.red : COL.mute,
          v: 30 * Math.pow(1.5, L().belt), tau: 0, k: 'r',
        });
      }
    }

    // ---- a slow trickle of stray dust, always
    S.trickle += dt;
    while (S.trickle > trickleEvery()) { S.trickle -= trickleEvery(); addEntityDust(1, quiet ? { instant: true } : {}); }

    if (!quiet) {
      for (const r of ripples) r.t += dt;
      for (let i = ripples.length - 1; i >= 0; i--) if (ripples[i].t > ripples[i].life) ripples.splice(i, 1);
      for (const j of jetFx) j.t += dt;
      for (let i = jetFx.length - 1; i >= 0; i--) if (jetFx[i].t > jetFx[i].life) jetFx.splice(i, 1);
      for (const f of flares) f.t += dt;
      while (flares.length && flares[0].t > 1.4) flares.shift();
      if (scene) { scene.t += dt; if (scene.t > scene.until) scene = null; }
      gains.push([dt, gainAcc]); gainAcc = 0;
      let span = 0;
      for (const [d] of gains) span += d;
      while (span > 20 && gains.length) span -= gains.shift()[0];
    }
  };

  // ================================================================ drawing
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const resize = () => {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  };
  window.addEventListener('resize', resize);

  // Far-off grains in two depths: they barely move, which makes everything else feel enormous.
  const STARS = [0, 1].map((layer) => Array.from({ length: 140 }, (_, i) => ({ x: hash(i * 3.1 + layer * 91), y: hash(i * 7.7 + layer * 13), s: 0.4 + hash(i + layer * 5) * (layer ? 1 : 0.6), a: 0.1 + hash(i * 1.3 + layer) * (layer ? 0.18 : 0.1) })));
  const drawStars = (z) => {
    const tile = Math.max(W, H) * 1.4;
    STARS.forEach((layer, li) => {
      const f = li ? 0.12 : 0.05;
      const zz = Math.pow(z, li ? 0.14 : 0.06);
      ctx.fillStyle = N > 0.5 ? 'rgb(235,240,255)' : paint(COL.ink);
      for (const s of layer) {
        let x = (s.x * tile - cam.x * f * z + t * (li ? 0.6 : 0.25)) * zz;
        let y = (s.y * tile - cam.y * f * z) * zz;
        x = ((x % tile) + tile) % tile - (tile - W) / 2;
        y = ((y % tile) + tile) % tile - (tile - H) / 2;
        // At night the far grains become faint stars that slowly twinkle.
        ctx.globalAlpha = s.a * (1 + N * (1.6 + 0.8 * Math.sin(t * (0.4 + s.x) + s.y * 40)));
        ctx.fillRect(x, y, s.s * (1 + N * 0.4), s.s * (1 + N * 0.4));
      }
    });
    ctx.globalAlpha = 1;
  };

  // Nebula: enormous pale clouds in slow spiral arms, beyond everything else.
  const NEB = Array.from({ length: 34 }, (_, i) => ({ arm: i % 3, f: hash(i * 2.3), j: hash(i * 5.9), s: 0.5 + hash(i * 9.1) }));
  const drawNebula = () => {
    const lv = L().nebula;
    if (!lv) return;
    const nr = nebulaRadius();
    const n = Math.min(NEB.length, 10 + lv * 6);
    for (let i = 0; i < n; i++) {
      const b = NEB[i];
      const a = b.arm * (Math.PI * 2 / 3) + b.f * 2.2 + t * 0.004;
      const r = nr * (0.82 + b.f * 0.45) + (b.j - 0.5) * 60;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      const s = (70 + b.s * 120) * (0.8 + 0.1 * lv);
      const c = [COL.red, COL.blue, COL.yellow][b.arm];
      const gr = ctx.createRadialGradient(x, y, 0, x, y, s);
      gr.addColorStop(0, rgba(c, (0.07 + 0.012 * lv) * (1 + 1.6 * N)));
      gr.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(x, y, s, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  const drawBelt = (px) => {
    const lv = L().belt;
    if (!lv) return;
    const br = beltRadius(), n = 70 + lv * 45;
    const w = KE * Math.pow(br, -1.5);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + t * w * (0.85 + 0.3 * hash(i)) + hash(i * 3) * 0.2;
      const r = br + (hash(i * 7) - 0.5) * 34;
      const s = Math.max(1.2 + hash(i * 11) * 2.4, px * 0.7);
      ctx.fillStyle = paint(i % 13 === 0 ? COL.red : i % 5 === 0 ? COL.ink : COL.mute);
      ctx.globalAlpha = 0.55;
      ctx.save();
      ctx.translate(Math.cos(a) * r, Math.sin(a) * r);
      ctx.rotate(t * (0.1 + hash(i * 5) * 0.4) + i);
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };

  // Accretion disk: fine, fast matter hugging the entity (drawn procedurally, never saved).
  const drawDisk = (R, px) => {
    const lv = L().disk;
    if (!lv) return;
    const n = Math.min(520, 70 * lv);
    const paths = new Map();
    for (let i = 0; i < n; i++) {
      const r = R * (1.12 + Math.pow(hash(i * 1.7), 1.6) * 1.5);
      const w = KE * Math.pow(r, -1.5) * 1.6;
      const a = hash(i * 4.1) * Math.PI * 2 + t * w;
      const len = Math.min(1.4, w * 0.9);
      const c = i % 9 === 0 ? COL.red : i % 11 === 0 ? COL.yellow : i % 7 === 0 ? COL.blue : COL.ink;
      let p = paths.get(c);
      if (!p) { p = new Path2D(); paths.set(c, p); }
      p.moveTo(Math.cos(a - len) * r, Math.sin(a - len) * r);
      p.arc(0, 0, r, a - len, a);
    }
    ctx.lineWidth = Math.max(px * 0.8, 0.35);
    for (const [c, p] of paths) {
      ctx.strokeStyle = paint(c);
      ctx.globalAlpha = (c === COL.ink ? 0.16 : 0.3) * (1 + 0.8 * N);
      ctx.stroke(p);
    }
    ctx.globalAlpha = 1;
  };

  const drawPhotonRing = (R, px) => {
    const lv = L().halo;
    if (!lv) return;
    const r = R * 1.55;
    const breathe = 0.5 + 0.5 * Math.sin(t * 0.9);
    ctx.lineWidth = Math.max(px * (1 + 0.15 * lv), 0.4);
    ctx.strokeStyle = rgba(COL.yellow, (0.35 + 0.25 * breathe) * (1 + 0.6 * N));
    ctx.setLineDash([R * 0.08, R * 0.12]);
    ctx.lineDashOffset = -t * R * 0.2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = rgba(COL.yellow, 0.18);
    ctx.lineWidth = Math.max(px * 0.6, 0.3);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.07, 0, Math.PI * 2);
    ctx.stroke();
    // Flares: a brief radial streak where a lucky arrival lands.
    for (const f of flares) {
      const k = f.t / 1.4;
      ctx.strokeStyle = rgba(f.c, (1 - k) * 0.8);
      ctx.lineWidth = Math.max(px * 2, 0.6);
      ctx.beginPath();
      ctx.moveTo(Math.cos(f.th) * R, Math.sin(f.th) * R);
      ctx.lineTo(Math.cos(f.th) * R * (1.6 + ease(k) * 3), Math.sin(f.th) * R * (1.6 + ease(k) * 3));
      ctx.stroke();
    }
  };

  const drawJets = (R, px) => {
    const lv = L().jets;
    if (!lv) return;
    const axis = -Math.PI / 2 + 0.35;
    const idle = 0.12 + 0.06 * Math.sin(t * 1.3);
    const drawPair = (power, len, alpha) => {
      for (const s of [1, -1]) {
        const dx = Math.cos(axis) * s, dy = Math.sin(axis) * s;
        const gr = ctx.createLinearGradient(dx * R, dy * R, dx * R * len, dy * R * len);
        gr.addColorStop(0, rgba(N > 0.5 ? 'glow' : COL.ink, alpha * (1 + 0.5 * N)));
        gr.addColorStop(1, rgba(N > 0.5 ? 'glow' : COL.ink, 0));
        ctx.strokeStyle = gr;
        ctx.lineWidth = Math.max(px * (1 + power * 3), R * 0.06 * power + px);
        ctx.beginPath();
        ctx.moveTo(dx * R, dy * R);
        ctx.lineTo(dx * R * len, dy * R * len);
        ctx.stroke();
      }
    };
    drawPair(0.2, 4 + lv, idle);
    for (const j of jetFx) {
      const k = j.t / j.life;
      drawPair(j.power, 4 + ease(Math.min(1, k * 2.5)) * 26, (1 - k) * 0.55 * j.power + 0.05);
    }
  };

  const drawComets = (px) => {
    for (const c of S.comets) {
      const r = (c.a * (1 - c.e * c.e)) / (1 + c.e * Math.cos(c.th));
      const a = c.th + c.tilt;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      // Its path, faint.
      ctx.strokeStyle = rgba(COL.ink, 0.06);
      ctx.lineWidth = px;
      ctx.beginPath();
      for (let k = 0; k <= 120; k++) {
        const th = (k / 120) * Math.PI * 2, rr = (c.a * (1 - c.e * c.e)) / (1 + c.e * Math.cos(th));
        const xx = Math.cos(th + c.tilt) * rr, yy = Math.sin(th + c.tilt) * rr;
        k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      }
      ctx.stroke();
      // Its tail points away from the entity and stretches as it comes close.
      const d = Math.hypot(x, y) || 1, ux = x / d, uy = y / d;
      const tail = Math.min(90, 5200 / d);
      for (let k = 10; k >= 1; k--) {
        const f = k / 10;
        ctx.fillStyle = rgba(COL.ink, 0.28 * (1 - f));
        ctx.beginPath();
        ctx.arc(x + ux * tail * f + (-uy) * Math.sin(k + t) * 0.8, y + uy * tail * f + ux * Math.sin(k + t) * 0.8, Math.max(px, 2.4 * (1 - f * 0.7)), 0, Math.PI * 2);
        ctx.fill();
      }
      if (N > 0.01) {
        const gr = ctx.createRadialGradient(x, y, 0, x, y, 14);
        gr.addColorStop(0, rgba('glow', 0.45 * N));
        gr.addColorStop(1, rgba('glow', 0));
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(x, y, 14, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = paint(COL.ink);
      ctx.beginPath();
      ctx.arc(x, y, Math.max(px * 2, 2.6), 0, Math.PI * 2);
      ctx.fill();
    }
  };

  const drawTrojans = (pl, px) => {
    const n = Math.round(pl.vis.trojan * 8);
    if (!n) return;
    const alpha = Math.min(1, pl.vis.trojan) * 0.8;
    for (const side of [1, -1]) {
      const base = pl.th + side * Math.PI / 3 + Math.sin(t * 0.07 + pl.id) * 0.06;
      for (let i = 0; i < n; i++) {
        const a = base + (hash(i * 3 + pl.id + side) - 0.5) * 0.22;
        const r = pl.r + (hash(i * 7 + pl.id - side) - 0.5) * 14;
        ctx.fillStyle = rgba(i % 4 ? COL.ink : pl.color, alpha);
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r, Math.sin(a) * r, Math.max(px * 1.1, 0.9 + hash(i) * 0.9), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  };

  const drawPlanet = (pl, p, px) => {
    const v = pl.vis;
    let pr = v.rad;
    if (pl.merging !== undefined) pr *= 1 - ease(Math.min(1, pl.merging / 3));
    // Atmosphere: a soft glow that deepens with each level.
    if (v.atmo > 0.01) {
      const ar = pr * (1.5 + 0.18 * v.atmo);
      const gr = ctx.createRadialGradient(p.x, p.y, pr * 0.9, p.x, p.y, ar);
      gr.addColorStop(0, rgba(pl.color, 0.1 + 0.05 * v.atmo));
      gr.addColorStop(1, rgba(pl.color, 0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(p.x, p.y, ar, 0, Math.PI * 2);
      ctx.fill();
    }
    // Rings: a tilted band, drawn in two halves so the planet sits inside it.
    const ringBand = (from, to) => {
      if (v.rings < 0.01) return;
      const k = Math.min(1, v.rings);
      for (let b = 0; b < 3 + Math.round(v.rings); b++) {
        const rr = pr * (1.55 + b * 0.22) * (0.6 + 0.4 * k);
        ctx.strokeStyle = rgba(COL.ink, (0.35 - b * 0.05) * k);
        ctx.lineWidth = Math.max(px * 0.8, pr * 0.05);
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, rr, rr * 0.32, -0.35, from, to);
        ctx.stroke();
      }
    };
    ringBand(Math.PI, Math.PI * 2);
    // Night: each planet glows softly in its own colour.
    if (N > 0.01) {
      const gr = ctx.createRadialGradient(p.x, p.y, pr * 0.8, p.x, p.y, pr * 2.8);
      gr.addColorStop(0, rgba(pl.color, 0.38 * N));
      gr.addColorStop(1, rgba(pl.color, 0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr * 2.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = paint(pl.color);
    ctx.beginPath();
    ctx.arc(p.x, p.y, pr, 0, Math.PI * 2);
    ctx.fill();
    // A faint terminator gives the planet volume without breaking the flat style.
    ctx.fillStyle = rgba('body', 0.08 + 0.1 * N);
    ctx.beginPath();
    ctx.arc(p.x, p.y, pr, Math.atan2(p.y, p.x) - Math.PI / 2, Math.atan2(p.y, p.x) + Math.PI / 2);
    ctx.fill();
    ringBand(0, Math.PI);
    if (focus === pl.id) {
      ctx.strokeStyle = rgba(COL.ink, 0.25);
      ctx.lineWidth = px;
      ctx.setLineDash([3 * px, 4 * px]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr + 7 * px, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  };

  const draw = () => {
    const z = Math.exp(cam.lz);
    const vc = viewCenter();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = paint(COL.sky);
    ctx.fillRect(0, 0, W, H);
    drawStars(z);
    ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (vc.x - cam.x * z), dpr * (vc.y - cam.y * z));
    const px = 1 / z;
    const R = entityRadius() * (1 + 0.012 * Math.sin(t * 0.6));

    drawNebula();
    drawBelt(px);

    // Orbit guides: faint, firmer for anchored planets.
    for (const pl of S.planets) {
      ctx.lineWidth = px * (1 + pl.vis.anchor);
      ctx.strokeStyle = rgba(COL.ink, (0.06 + 0.12 * pl.vis.anchor) * (1 - 0.3 * N));
      ctx.beginPath();
      ctx.arc(0, 0, pl.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // The entity's halo: wide and soft, wider as it grows.
    // By day a soft shadow; by night a luminous halo with the entity as a silhouette against it.
    const halo = ctx.createRadialGradient(0, 0, R * 0.9, 0, 0, R * 3.8);
    halo.addColorStop(0, rgba('body', 0.11 * (1 - N)));
    halo.addColorStop(1, rgba('body', 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, R * 3.8, 0, Math.PI * 2);
    ctx.fill();
    if (N > 0.01) {
      const glow = ctx.createRadialGradient(0, 0, R * 0.96, 0, 0, R * 3.2);
      glow.addColorStop(0, rgba('glow', 0.55 * N));
      glow.addColorStop(0.18, rgba('glow', 0.2 * N));
      glow.addColorStop(1, rgba('glow', 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, R * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    drawDisk(R, px);

    // Loose matter: a short arc of trail behind each mote, then the mote. Batched by colour.
    const pp = new Map();
    for (const pl of S.planets) pp.set(pl.id, planetPos(pl));
    const trails = new Map(), heads = new Map(), rocks = [];
    const trailScale = Math.min(1, z / 1.2) * 0.9 + 0.1;
    for (const q of S.parts) {
      const c = q.p ? pp.get(q.p) : null;
      const ox = c ? c.x : 0, oy = c ? c.y : 0;
      const x = ox + Math.cos(q.th) * q.r, y = oy + Math.sin(q.th) * q.r;
      if (q.k === 'r') { rocks.push([x, y, q]); continue; }
      const parentR = q.p ? planetRadius(planetById(q.p)) : R;
      const w = orbitSpeed(q, parentR);
      const len = Math.min(1.1, w * 2.2) * trailScale;
      let tp = trails.get(q.c);
      if (!tp) { tp = new Path2D(); trails.set(q.c, tp); }
      tp.moveTo(ox + Math.cos(q.th - len) * q.r, oy + Math.sin(q.th - len) * q.r);
      tp.arc(ox, oy, q.r, q.th - len, q.th);
      let hp = heads.get(q.c);
      if (!hp) { hp = new Path2D(); heads.set(q.c, hp); }
      // Real size, never below half a pixel: far out, matter becomes faint grains, which reads as distance.
      const s = Math.max(q.s * 0.6, px * 0.5);
      hp.moveTo(x + s, y);
      hp.arc(x, y, s, 0, Math.PI * 2);
    }
    ctx.lineCap = 'round';
    for (const [c, p] of trails) {
      ctx.strokeStyle = paint(c);
      ctx.globalAlpha = (c === COL.ink ? 0.12 : 0.22) * (1 + 0.7 * N);
      ctx.lineWidth = Math.max(px * 0.9, 0.45);
      ctx.stroke(p);
    }
    // Night: a faint glow around every mote.
    if (N > 0.01) {
      ctx.lineWidth = Math.max(px * 3.2, 2.2);
      for (const [c, p] of heads) {
        ctx.strokeStyle = paint(c);
        ctx.globalAlpha = 0.09 * N;
        ctx.stroke(p);
      }
    }
    for (const [c, p] of heads) {
      ctx.globalAlpha = c === COL.ink ? 0.72 + 0.2 * N : 0.95;
      ctx.fillStyle = paint(c);
      ctx.fill(p);
    }
    ctx.globalAlpha = 1;
    for (const [x, y, q] of rocks) {
      const s = Math.max(q.s * 0.8, px * 0.6);
      ctx.fillStyle = paint(q.c);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * 0.4 + q.th * 3);
      ctx.fillRect(-s, -s, s * 2, s * 2);
      ctx.restore();
    }

    // Ripples where matter lands (on the entity, or riding a planet).
    for (const r of ripples) {
      if (r.t < 0) continue;
      const k = r.t / r.life;
      const o = r.parent ? pp.get(r.parent) : null;
      const x = r.x + (o ? o.x : 0), y = r.y + (o ? o.y : 0);
      ctx.strokeStyle = paint(r.color);
      ctx.globalAlpha = (1 - k) * (r.r > 20 ? 0.5 : 0.7);
      ctx.lineWidth = Math.max(px * (r.r > 20 ? 2 : 1.2), 0.3);
      ctx.beginPath();
      ctx.arc(x, y, r.r * (0.3 + ease(k) * 0.9), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const pl of S.planets) drawTrojans(pl, px);
    for (const pl of S.planets) drawPlanet(pl, pp.get(pl.id), px);
    drawComets(px);
    drawJets(R, px);

    // The entity.
    ctx.fillStyle = PALS.body;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fill();
    drawPhotonRing(R, px);
  };

  // ================================================================ interface
  const shop = document.getElementById('shop');
  const titleName = document.getElementById('t-name'), titleInfo = document.getElementById('t-info');
  const back = document.getElementById('back'), release = document.getElementById('release');
  let cards = [];
  let cardsFor = 0; // which planet the cards belong to (0 = the whole system)
  let unlockSig = '';
  const visibleItems = (pl) => {
    const list = pl ? PLANET : SYSTEM;
    const open = list.filter((it) => S.total >= it.unlock);
    const next = list.find((it) => S.total < it.unlock);
    return { open, next };
  };
  const buildShop = () => {
    const pl = focus ? planetById(focus) : null;
    cardsFor = pl ? pl.id : 0;
    const { open, next } = visibleItems(pl);
    unlockSig = `${cardsFor}:${open.length}`;
    shop.replaceChildren();
    cards = open.map((it) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.id = `buy-${it.id}`;
      b.innerHTML = `<svg viewBox="0 0 26 26" aria-hidden="true">${ICON[it.id]}</svg>
        <span class="name">${it.name}<span class="lv"></span></span><span class="what"></span><span class="cost"></span>`;
      b.addEventListener('click', () => {
        const target = cardsFor ? planetById(cardsFor) : null;
        if (cardsFor && !target) return;
        const c = it.cost(target);
        if (!canBuy(it, target) || S.mass < c) return;
        S.mass -= c;
        toast(it.buy(target));
        refresh(); save();
      });
      shop.appendChild(b);
      return { it, b, lv: b.querySelector('.lv'), what: b.querySelector('.what'), cost: b.querySelector('.cost') };
    });
    if (next) {
      const m = document.createElement('div');
      m.className = 'item mystery';
      m.innerHTML = `<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" opacity=".5" stroke-dasharray="2 3"/></svg>
        <span class="name">Something stirs</span><span class="what">Revealed when the entity has absorbed ${fmt(next.unlock)} in all</span><span class="cost"></span>`;
      shop.appendChild(m);
    }
    back.hidden = !pl;
  };
  const canBuy = (it, pl) => {
    if (it.can && !it.can(pl)) return false;
    return levelOf(it, pl) < it.max;
  };
  const setFocus = (id) => {
    if (focus === id) return;
    focus = id;
    scene = null;
    shop.classList.add('swap');
    setTimeout(() => { buildShop(); refresh(); shop.classList.remove('swap'); }, reduced ? 0 : 280);
  };
  back.addEventListener('click', () => { resetUserView(); setFocus(0); });
  release.addEventListener('click', () => {
    const pl = planetById(focus);
    if (!pl || !pl.anchored) return;
    pl.anchored = false;
    pl.vd *= 2.5;
    toast(`Planet ${pl.name} begins to fall`);
    refresh(); save();
  });

  const massEl = document.getElementById('mass'), rateEl = document.getElementById('rate');
  const refresh = () => {
    massEl.textContent = fmt(S.mass);
    homeBtn.hidden = Math.abs(user.lz) < 0.05 && Math.hypot(user.x, user.y) < 2;
    let span = 0, sum = 0;
    for (const [d, g] of gains) { span += d; sum += g; }
    rateEl.textContent = `absorbing ${fmt(sum / Math.max(1, span))}/s`;
    const pl = focus ? planetById(focus) : null;
    if (pl) {
      titleName.textContent = `Planet ${pl.name}`;
      const eta = (pl.r - entityRadius() - planetRadius(pl) * 0.6) / (pl.vd * gravMult());
      const sats = S.parts.filter((q) => q.p === pl.id).length;
      const when = pl.anchored ? 'held in orbit' : `falls in about ${eta > 90 ? `${Math.round(eta / 60)} min` : `${Math.max(1, Math.round(eta))} s`}`;
      titleInfo.textContent = pl.merging !== undefined ? 'Falling into the entity' : `Mass ${fmt(pl.mass)} · ${sats} in orbit · ${when}`;
      release.hidden = !pl.anchored;
    } else {
      titleName.textContent = 'The entity';
      titleInfo.textContent = S.planets.length ? 'Tap a planet to tend it' : `${S.parts.length} motes in orbit`;
      release.hidden = true;
    }
    if (cardsFor !== (pl ? pl.id : 0)) return; // mid-swap: leave the old cards alone
    if (`${cardsFor}:${visibleItems(pl).open.length}` !== unlockSig) { buildShop(); toast('Something new stirs'); }
    for (const c of cards) {
      const can = canBuy(c.it, pl), cost = c.it.cost(pl), lock = c.it.lock ? c.it.lock() : '';
      const lv = levelOf(c.it, pl);
      c.lv.textContent = c.it.lvText ? c.it.lvText() : c.it.max === 999 ? `${lv}` : `${lv}/${c.it.max}`;
      c.what.textContent = lock || c.it.what(pl);
      c.cost.textContent = can ? fmt(cost) : lock ? 'Unavailable' : 'Complete';
      c.b.classList.toggle('done', !can);
      c.b.classList.toggle('poor', can && S.mass < cost);
      c.b.classList.toggle('ready', can && S.mass >= cost);
      c.b.setAttribute('aria-disabled', String(!can || S.mass < cost));
    }
  };

  // Gestures: tap a planet to glide in, tap empty sky to glide out; drag to pan; pinch or scroll to zoom.
  const pts = new Map();
  let down = null, pinch = 0;
  const homeBtn = document.getElementById('home');
  const clampZoom = () => { user.lz = Math.max(USER_ZOOM[0], Math.min(USER_ZOOM[1], user.lz)); };
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture?.(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    down = pts.size === 1 ? { x: e.clientX, y: e.clientY, moved: false } : null;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', (e) => {
    const prev = pts.get(e.pointerId);
    if (!prev) return;
    const z = Math.exp(cam.lz);
    if (pts.size === 1) {
      if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
      if (down && down.moved) { user.x -= (e.clientX - prev.x) / z; user.y -= (e.clientY - prev.y) / z; }
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch > 0) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      user.lz += Math.log(d / pinch);
      clampZoom();
      pinch = d;
      down = null;
    }
  });
  const endPointer = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = 0;
  };
  canvas.addEventListener('pointercancel', (e) => { endPointer(e); down = null; });
  canvas.addEventListener('pointerup', (e) => {
    endPointer(e);
    if (!down || down.moved || opening) { down = null; return; }
    down = null;
    const z = Math.exp(cam.lz), vc = viewCenter();
    const wx = (e.clientX - vc.x) / z + cam.x, wy = (e.clientY - vc.y) / z + cam.y;
    let best = null, bestD = Infinity;
    for (const pl of S.planets) {
      if (pl.merging !== undefined) continue;
      const p = planetPos(pl), d = Math.hypot(p.x - wx, p.y - wy);
      if (d < Math.max(planetRadius(pl) * 2.2, 26 / z) && d < bestD) { best = pl; bestD = d; }
    }
    if (best) { resetUserView(); setFocus(best.id); }
    else if (focus) { resetUserView(); setFocus(0); }
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    user.lz -= e.deltaY * 0.0015;
    clampZoom();
  }, { passive: false });
  homeBtn.addEventListener('click', () => resetUserView());

  const toastEl = document.getElementById('toast');
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  const resetBtn = document.getElementById('reset');
  let armed = 0;
  resetBtn.addEventListener('click', () => {
    if (!armed) {
      armed = setTimeout(() => { armed = 0; resetBtn.classList.remove('armed'); resetBtn.textContent = 'Begin again'; }, 2500);
      resetBtn.classList.add('armed');
      resetBtn.textContent = 'Tap again to begin again';
      return;
    }
    clearTimeout(armed); armed = 0;
    S = fresh(); begin(); focus = 0; scene = null; buildShop(); refresh(); save();
    resetBtn.classList.remove('armed'); resetBtn.textContent = 'Begin again';
  });

  // ================================================================ start
  // A quick first minute: dust already close in, so the entity starts drinking straight away.
  const begin = () => { addEntityDust(70, { instant: true, close: true }); S.mass = 0; };
  if (!loaded || !S.parts.length) begin();

  // Time away: the system keeps turning, in coarse steps (up to an hour).
  if (loaded) {
    const away = Math.min(3600, Math.max(0, (Date.now() - (S.last || Date.now())) / 1000));
    if (away > 20) {
      const before = S.total;
      for (let s = 0; s < away; s += 1) step(1, true);
      const gained = S.total - before;
      if (gained > 0) setTimeout(() => toast(`While you were away the entity absorbed ${fmt(gained)}`), 4600);
    }
  }

  // Day and night follow the local clock; the sky eases between them.
  let nightTarget = nightness(), themeTimer = 0;
  setPalette(nightTarget);
  window.addEventListener('hashchange', () => { nightTarget = nightness(); });
  resize();
  { const tg = camTarget(); cam.x = tg.x; cam.y = tg.y; cam.lz = Math.log(tg.z); }

  // Opening: start far out with the title, glide in, then bring in the interface. A tap skips it.
  let opening = true;
  const introEl = document.getElementById('intro');
  document.body.classList.add('opening');
  user.lz = Math.log(0.05);
  cam.lz += user.lz;
  const timers = [];
  const finishOpening = () => {
    if (!opening) return;
    opening = false;
    timers.forEach(clearTimeout);
    resetUserView();
    introEl.classList.remove('show');
    document.body.classList.remove('opening');
  };
  if (reduced) finishOpening();
  else {
    requestAnimationFrame(() => introEl.classList.add('show'));
    timers.push(setTimeout(() => resetUserView(), 1700));
    timers.push(setTimeout(() => introEl.classList.remove('show'), 3000));
    timers.push(setTimeout(finishOpening, 4200));
    window.addEventListener('pointerdown', finishOpening, { once: true });
  }
  buildShop();
  refresh();
  let last = performance.now(), uiTimer = 0, saveTimer = 0;
  const frame = (now) => {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    themeTimer += dt;
    if (themeTimer > 5) { themeTimer = 0; nightTarget = nightness(); }
    if (Math.abs(nightTarget - N) > 0.001) setPalette(N + (nightTarget - N) * (1 - Math.exp(-dt / 1.2)));
    step(dt, false);
    stepCamera(dt);
    draw();
    uiTimer += dt; saveTimer += dt;
    if (uiTimer > 0.25) { uiTimer = 0; refresh(); }
    if (saveTimer > 6) { saveTimer = 0; save(); }
  };
  requestAnimationFrame(frame);
  // Test hook: window.__entity.S is the live state.
  window.__entity = {
    get S() { return S; },
    planetScreen: (id) => {
      const pl = planetById(id), z = Math.exp(cam.lz), vc = viewCenter(), p = planetPos(pl);
      return { x: vc.x + (p.x - cam.x) * z, y: vc.y + (p.y - cam.y) * z };
    },
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else last = performance.now(); });
  window.addEventListener('pagehide', save);
})();
</script>
